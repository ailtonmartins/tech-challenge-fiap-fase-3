name: tech-challenge-fiap-fase-3

x-timezone-environment: &timezone-environment
  TZ: America/Sao_Paulo

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    environment:
      <<: *timezone-environment
      POSTGRES_DB: ${POSTGRES_DB:-hospital}
      POSTGRES_USER: ${POSTGRES_USER:-hospital_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hospital]

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      <<: *timezone-environment
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [hospital]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      <<: *timezone-environment
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [hospital]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command:
      - "--kafka.server=kafka:29092"
    environment:
      <<: *timezone-environment
    ports:
      - "127.0.0.1:9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [hospital]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    environment:
      <<: *timezone-environment
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      servico-agendamento:
        condition: service_healthy
      servico-historico:
        condition: service_healthy
      servico-notificacao:
        condition: service_healthy
      kafka-exporter:
        condition: service_started
    networks: [hospital]

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/config.yml
    environment:
      <<: *timezone-environment
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [hospital]

  alloy:
    image: grafana/alloy:v1.9.0
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    environment:
      <<: *timezone-environment
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    networks: [hospital]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      <<: *timezone-environment
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks: [hospital]

  servico-agendamento:
    build:
      context: .
      dockerfile: servico-agendamento/Dockerfile
    environment:
      <<: *timezone-environment
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Sao_Paulo
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      AGENDAMENTO_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hospital}?currentSchema=agendamento
      POSTGRES_USER: ${POSTGRES_USER:-hospital_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "8080:8080"
      - "127.0.0.1:6565:6565"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [hospital]

  servico-historico:
    build:
      context: .
      dockerfile: servico-historico/Dockerfile
    environment:
      <<: *timezone-environment
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Sao_Paulo
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      HISTORICO_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hospital}?currentSchema=historico
      POSTGRES_USER: ${POSTGRES_USER:-hospital_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [hospital]

  servico-notificacao:
    build:
      context: .
      dockerfile: servico-notificacao/Dockerfile
    environment:
      <<: *timezone-environment
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Sao_Paulo
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      NOTIFICACAO_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hospital}?currentSchema=notificacao
      PACIENTE_GRPC_HOST: servico-agendamento
      PACIENTE_GRPC_PORT: 6565
      PACIENTE_GRPC_DEADLINE_MILLIS: 2000
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      servico-agendamento:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [hospital]

networks:
  hospital:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
